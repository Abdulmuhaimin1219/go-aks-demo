name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-push:
    uses: Abdulmuhaimin1219/my-devops-playbook/.github/workflows/reusable-build-push-acr.yml@main

    with:
      runner: self-hosted
      acr-name: abdulacr

    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
