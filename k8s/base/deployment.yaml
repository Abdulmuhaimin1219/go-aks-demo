apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-aks-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-aks-demo
  template:
    metadata:
      labels:
        app: go-aks-demo
    spec:
      containers:
        - name: go-aks-demo
          image: abdulacr.azurecr.io/go-aks-demo:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "dev"
            - name: APP_VERSION
              value: "IMAGE_TAG"

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi